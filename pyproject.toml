[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-clustering"
version = "1.0.0"
description = "Анализ научных публикаций и поиск тематических сообществ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8,<4",
    "python-docx>=1.1,<2",
    "striprtf>=0.0.26,<1",
]

[project.scripts]
sciintel = "sciintel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
